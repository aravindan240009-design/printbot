name: Phase 0 isolated proof checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/printer-proof/**'
      - 'packages/printplan/**'
      - 'fixtures/**'
      - 'tests/phase0/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/phase0.yml'
jobs:
  portable-contract-and-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt,clippy
      - run: python -m pip install -r requirements-phase0.txt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --locked -p printer-proof
      - run: python -m pytest tests/phase0 -q
      - run: node packages/printplan/typescript/printplan.ts
      - run: python scripts/phase0/verify_evidence.py
# This portable job cannot certify Windows drivers, DLL loading or physical output.
# No release publication; run equivalent commands locally without GitHub CI.
