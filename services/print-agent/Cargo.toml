[package]
name = "print-agent"
version = "0.1.0"
edition = "2021"
publish = false
description = "Print Bot Phase 3 Windows print service and local IPC agent"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Services"
] }
