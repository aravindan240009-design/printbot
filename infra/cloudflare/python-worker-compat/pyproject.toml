[project]
name = "python-worker-compat"
version = "0.1.0"
description = "Local-only Cloudflare Python Worker compatibility check for Print Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.1",
    "httpx==0.28.1",
    "pydantic[email]==2.12.5",
    "python-multipart==0.0.12",
    "Pillow==12.2.0",
    "pypdf==6.19.0",
]

[dependency-groups]
dev = ["workers-py==1.17.9", "workers-runtime-sdk"]
