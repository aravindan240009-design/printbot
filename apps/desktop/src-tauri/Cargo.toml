[package]
name = "print-bot"
version = "1.0.0"
description = "Print Bot Multi-Tenant Print Shop SaaS Windows Desktop Workstation"
edition = "2021"

[[bin]]
name = "print-bot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Foundation"
] }
